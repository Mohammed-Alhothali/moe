name: lint rules
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static checks on the Wazuh rules
        run: python3 tests/lint_rules.py
      - name: Regression cases are up to date
        run: |
          python3 tests/build_cases.py
          git diff --exit-code tests/cases
      - name: Console and demo compile
        run: python3 -m py_compile console/app/moe_console.py console/setup_accounts.py demo/*.py
