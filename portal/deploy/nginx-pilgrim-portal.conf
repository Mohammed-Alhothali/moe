# Rifadah Pilgrim Services Portal - nginx front end
# Access log (combined format) feeds the built-in Wazuh web-accesslog decoder -> UC06 edge rules.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location /static/ {
        alias /opt/pilgrim-portal/public/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;        # the app trusts only this header
        proxy_set_header CF-Connecting-IP "";           # never pass a client-supplied value
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# UC04 demo entrance, used only by the Cloudflare quick tunnel (start-uc04-tunnel.sh).
# Listens on loopback; only the sign-in pages are reachable through it.
server {
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/tunnel-access.log;

    location /static/ {
        alias /opt/pilgrim-portal/public/static/;
    }

    location ~ ^/(login|logout|dashboard)?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;   # real client IP as seen by Cloudflare
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 403;
    }
}
