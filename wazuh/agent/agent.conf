<!-- PILGRIM-LAB BEGIN (managed by deploy_manager.sh - edits between these markers are replaced) -->
<!--
  Centralized agent configuration for the pilgrim detection lab (agent group: default).
  Linux agents (web01): portal audit log, nginx access log, auditd, auth.log (sudo), FIM on the web root,
  sudoers and cron.
  Windows agents: Sysmon, PowerShell and Defender channels (Security/System/Application are collected
  by the agent's default configuration), FIM on the lab share.
  Duplicate sources (e.g. a channel also listed in the agent's local ossec.conf) are removed by the agent.
-->
<agent_config os="Linux">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/pilgrim-portal/portal.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <syscheck>
    <directories realtime="yes" check_all="yes">/opt/pilgrim-portal/public</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/sudoers,/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/crontab,/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/etc/cron.weekly,/etc/cron.monthly,/var/spool/cron/crontabs</directories>
  </syscheck>
</agent_config>

<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <syscheck>
    <directories realtime="yes" check_all="yes">C:\PilgrimShare</directories>
  </syscheck>
</agent_config>
<!-- PILGRIM-LAB END -->
